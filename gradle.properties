# This box has 4 GB of RAM total. Keep the build inside ~1.4 GB.
org.gradle.jvmargs=-Xmx1100m -XX:MaxMetaspaceSize=384m -XX:+UseParallelGC -Dfile.encoding=UTF-8
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.workers.max=1
org.gradle.daemon=false

# Compile Kotlin inside the Gradle process — a separate 2.5 GB Kotlin daemon OOMs the machine.
kotlin.compiler.execution.strategy=in-process
kotlin.incremental=true

android.useAndroidX=true
android.nonTransitiveRClass=true
android.suppressUnsupportedCompileSdk=35
kotlin.code.style=official
